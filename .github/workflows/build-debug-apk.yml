name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend Server URL for /api/chat/stream (e.g. https://your-app.run.app)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Assemble Debug APK (Capacitor + Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android SDK Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build production web bundle (Vite)
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url || secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Initialize & sync Capacitor Android platform
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 --legacy-peer-deps
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          if [ -n "$ANDROID_HOME" ] && [ ! -f "android/local.properties" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          fi

      - name: Configure Android app name & Manifest permissions for Debug APK
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");

            const permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS"
            ];

            for (const perm of permissions) {
              if (!xml.includes(perm)) {
                xml = xml.replace(
                  "</manifest>",
                  `    <uses-permission android:name="${perm}" />\n</manifest>`
                );
              }
            }

            if (!xml.includes("usesCleartextTraffic")) {
              xml = xml.replace(
                "<application",
                "<application android:usesCleartextTraffic=\"true\""
              );
            }

            fs.writeFileSync(manifestPath, xml, "utf8");

            const stringsPath = "android/app/src/main/res/values/strings.xml";
            if (fs.existsSync(stringsPath)) {
              let stringsXml = fs.readFileSync(stringsPath, "utf8");
              stringsXml = stringsXml
                .replace(/<string name="app_name">.*?<\/string>/, "<string name=\"app_name\">DEFAULTER AI</string>")
                .replace(/<string name="title_activity_main">.*?<\/string>/, "<string name=\"title_activity_main\">DEFAULTER AI</string>");
              fs.writeFileSync(stringsPath, stringsXml, "utf8");
            }
          '

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEFAULTER-AI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
